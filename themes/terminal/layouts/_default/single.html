{{ define "main" }}
<article class="post">
  <h1>{{ .Title | markdownify | replaceRE "^<p>(.*)</p>\n?$" "$1" | safeHTML }}</h1>
  <p class="post-date muted">{{ .Date.Format "2006-01-02" }} · {{ .ReadingTime }} min read</p>
  <div class="post-content">
    {{ .Content }}
  </div>
  {{ if eq .Section "blog" }}
  <p class="back-link"><a href="/blog">← back to blog</a></p>
  {{ end }}
</article>
{{ end }}
